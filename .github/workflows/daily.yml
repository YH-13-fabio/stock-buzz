name: 每日爬取股票討論

on:
  schedule:
    # GitHub 用 UTC 時間：15:00 UTC = 台灣時間 23:00（GitHub 排程常會延遲 5～30 分鐘）
    - cron: "0 15 * * *"
  workflow_dispatch:   # 讓你可以在 Actions 頁面按按鈕手動執行

permissions:
  contents: write      # 允許把新資料存回 repo

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 安裝永豐 Shioaji（失敗也不影響爬文）
        continue-on-error: true
        run: pip install shioaji

      - name: 爬文與分析
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python main.py

      - name: 儲存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
