name: 每日爬取股票討論

# 這個排程在你自己的 Windows 電腦上執行（self-hosted runner），
# 因為 PTT 會擋 GitHub 雲端主機。電腦關機時，工作會在 GitHub 排隊，開機後自動補跑（最多等 24 小時）。

on:
  schedule:
    # GitHub 用 UTC 時間：15:00 UTC = 台灣時間 23:00（GitHub 排程常會延遲 5～30 分鐘）
    - cron: "0 15 * * *"
  workflow_dispatch:   # 讓你可以在 Actions 頁面按按鈕手動執行

permissions:
  contents: write      # 允許把新資料存回 repo

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: [self-hosted, stock-buzz]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PY: 'C:\Program Files\Python312\python.exe'
    defaults:
      run:
        # 只對這個排程放寬 PowerShell 腳本限制，不改動整台電腦的設定
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4
        with:
          clean: false   # 保留 .venv，不用每天重裝套件

      - name: 準備 Python 環境
        run: |
          if (-not (Test-Path .venv\Scripts\python.exe)) { & $env:PY -m venv .venv }
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -q -r requirements.txt
          exit $LASTEXITCODE

      - name: 安裝永豐 Shioaji（失敗也不影響爬文）
        continue-on-error: true
        run: |
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -q shioaji
          exit $LASTEXITCODE

      - name: 爬文與分析
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: |
          .\.venv\Scripts\python.exe main.py
          exit $LASTEXITCODE

      - name: 儲存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -q -m "daily update $(Get-Date -Format yyyy-MM-dd)"
            git push
            exit $LASTEXITCODE
          } else {
            Write-Output "no new data"
            exit 0
          }
