<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股市討論熱度</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --line: #e2e1dc;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #2a78d6;
  --accent-soft: #e3eefb;
  --bar: #86b6ef;
  --bull: #e34948;     /* 看多：台股慣例紅色 */
  --bear: #008300;     /* 看空：台股慣例綠色 */
  --neutral: #d9d8d3;
  --bull-ink: #c4302f;
  --bear-ink: #006e00;
  --ma5: #eb6834;
  --ma20: #4a3aa7;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2f2f2c;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1d2c40; --bar: #256abf;
    --bull: #e66767; --bear: #199e70; --neutral: #45443f;
    --bull-ink: #f08a8a; --bear-ink: #4cc79a; --ma5: #d95926; --ma20: #9085e9;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2f2f2c;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1d2c40; --bar: #256abf;
  --bull: #e66767; --bear: #199e70; --neutral: #45443f;
  --bull-ink: #f08a8a; --bear-ink: #4cc79a; --ma5: #d95926; --ma20: #9085e9;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { color: var(--text-3); font-size: 12px; }
.tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .d { font-size: 12px; color: var(--text-2); margin-top: 2px; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--text-2); font: inherit; padding: 6px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--text-3); font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.search { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; padding: 6px 12px; border-radius: 9px; width: 180px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15px; margin: 0; padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--text-3); font-size: 12px; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 6px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: 0; }
.c-rank { width: 36px; color: var(--text-3); text-align: right; }
.c-stock { width: 150px; }
.c-cnt { width: 22%; }
.c-chg { width: 70px; text-align: right; }
.stock-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.stock-code { color: var(--text-3); font-size: 12px; }
.cnt { display: flex; align-items: center; gap: 8px; }
.cnt .bar { height: 8px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.cnt .n { font-weight: 600; min-width: 2.5em; }
.split { display: flex; height: 8px; gap: 2px; border-radius: 4px; overflow: hidden; }
.split span { display: block; height: 100%; }
.split-txt { font-size: 12px; color: var(--text-2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up { color: var(--bull-ink); } .down { color: var(--bear-ink); } .flat { color: var(--text-3); }
.chg { color: var(--text-2); }

.stock-px { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.quote { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.quote .px { font-size: 26px; font-weight: 600; }
.quote .up, .quote .down, .quote .flat { font-size: 15px; font-weight: 600; }
.ind { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.ind > div.wide { grid-column: 1 / -1; }
.ind > div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.ind .k { display: block; font-size: 11px; color: var(--text-3); }
.ind .v { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ind .h { display: block; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sigs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.sig { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.legend i.ln { width: 14px; height: 0; border-top: 2px solid var(--accent); border-radius: 0; vertical-align: 3px; }
.legend i.ln.dash { border-top: 2px dashed var(--text-3); }
.nopx { margin: 0 0 10px; }
.stock-code { margin-right: 6px; }
.kbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
.kbar .seg button { padding: 4px 12px; font-size: 13px; }
.kpane { position: relative; border-top: 1px solid var(--line); }
.kpane:first-child { border-top: 0; }
.kpane .kleg { position: absolute; left: 6px; top: 4px; z-index: 3; font-size: 11px; color: var(--text-2); pointer-events: none;
  white-space: nowrap; overflow: hidden; max-width: calc(100% - 70px); text-overflow: ellipsis; }
.kpane .kleg b { color: var(--text); font-weight: 600; margin-right: 4px; }
.kpane .kleg i { font-style: normal; margin-right: 8px; }
.kchart { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.knote { font-size: 11px; color: var(--text-3); margin: -6px 0 12px; }
.kload { padding: 60px 0; text-align: center; color: var(--text-3); font-size: 13px; }
.sub-h { font-size: 13px; font-weight: 600; margin: 14px 0 4px; color: var(--text-2); }
.detail { position: sticky; top: 16px; }
.detail .body { padding: 0 16px 16px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin: 2px 0 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { fill: var(--text-3); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 5; }
.tip b { display: block; margin-bottom: 2px; }
.posts { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.posts li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.posts li:last-child { border-bottom: 0; }
.posts a { color: var(--text); text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.posts a:hover { color: var(--accent); text-decoration: underline; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.meta { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.empty { padding: 40px 16px; text-align: center; color: var(--text-3); }
.foot { color: var(--text-3); font-size: 12px; margin-top: 20px; line-height: 1.7; }

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .detail { position: static; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .search { margin-left: 0; width: 100%; }
}
@media (max-width: 560px) {
  .c-chg, td.c-chg { display: none; }
  .c-stock { width: 112px; }
  .c-cnt { width: 28%; }
  .tile .v { font-size: 20px; }
  .ind .v { font-size: 13px; }
  .ind > div { padding: 7px 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>股市討論熱度</h1>
      <div class="sub" id="sub">載入中…</div>
    </div>
  </header>

  <section class="tiles" id="tiles"></section>

  <div class="controls">
    <div class="seg" role="group" aria-label="期間">
      <button data-period="day" aria-pressed="true">今日</button>
      <button data-period="week" aria-pressed="false">本週（7 天）</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="來源"></div>
    <input class="search" id="search" type="search" placeholder="搜尋代號或名稱" aria-label="搜尋股票">
  </div>

  <div class="grid">
    <section class="card">
      <h2><span id="rankTitle">今日提及排行</span><small id="rankNote"></small></h2>
      <div id="rank"></div>
    </section>
    <section class="card detail" id="detail"></section>
  </div>

  <p class="foot">
    討論來源：PTT、YouTube 指定頻道（及選用的 Dcard）；股價來源：永豐金 Shioaji，技術指標由收盤資料計算。每則文章或影片對同一檔股票只算一次；PTT 推文另列為「PTT推文」。
    多空為程式自動判斷，僅反映討論氣氛，不構成任何投資建議。
  </p>
</div>
<div class="tip" id="tip"></div>

<script>
const SOURCES = [
  { key: "ptt", label: "PTT文章" },
  { key: "ptt_comment", label: "PTT推文" },
  { key: "youtube", label: "YouTube" },
  { key: "dcard", label: "Dcard" },
];
const SRC_LABEL = Object.fromEntries(SOURCES.map(s => [s.key, s.label]));
const state = { period: "day", sources: new Set(SOURCES.map(s => s.key)), q: "", sel: null, tf: "D" };
let DATA = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toLocaleString("zh-TW");
const md = d => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };

function load() {
  try { const s = JSON.parse(localStorage.getItem("buzz-prefs") || "{}");
    if (s.period) state.period = s.period;
    if (Array.isArray(s.sources)) state.sources = new Set(s.sources);
    if (["D", "W", "M"].includes(s.tf)) state.tf = s.tf;
  } catch (e) {}
}
function save() {
  try { localStorage.setItem("buzz-prefs", JSON.stringify({ period: state.period, sources: [...state.sources], tf: state.tf })); } catch (e) {}
}

// 把一段日期內、所選來源的資料加總成 {代號: {m, bull, bear, src:{}}}
function aggregate(days) {
  const out = {};
  for (const d of days) {
    const day = DATA.daily[d] || {};
    for (const [code, bySrc] of Object.entries(day)) {
      for (const [src, [m, bull, bear]] of Object.entries(bySrc)) {
        if (!state.sources.has(src)) continue;
        const o = out[code] || (out[code] = { m: 0, bull: 0, bear: 0, src: {} });
        o.m += m; o.bull += bull; o.bear += bear; o.src[src] = (o.src[src] || 0) + m;
      }
    }
  }
  return out;
}
function periodDays(offset = 0) {
  const n = state.period === "day" ? 1 : 7;
  const end = DATA.days.length - 1 - offset * n;
  return DATA.days.slice(Math.max(0, end - n + 1), end + 1);
}
function ranked() {
  const cur = aggregate(periodDays(0)), prev = aggregate(periodDays(1));
  let rows = Object.entries(cur).map(([code, o]) => ({ code, name: DATA.names[code] || code, ...o, prev: prev[code]?.m || 0 }));
  rows.sort((a, b) => b.m - a.m || b.bull - a.bull);
  rows.forEach((r, i) => r.rank = i + 1);
  const q = state.q.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.code.includes(q) || r.name.toLowerCase().includes(q));
  return { rows, cur, prev };
}

function renderTiles(rows, cur, prev) {
  const sum = o => Object.values(o).reduce((a, x) => a + x.m, 0);
  const total = sum(cur), totalPrev = sum(prev);
  const bull = Object.values(cur).reduce((a, x) => a + x.bull, 0);
  const bear = Object.values(cur).reduce((a, x) => a + x.bear, 0);
  const days = periodDays(0);
  let items = 0;
  for (const d of days) for (const [s, n] of Object.entries(DATA.item_counts[d] || {})) if (state.sources.has(s)) items += n;
  const top = [...rows].sort((a, b) => a.rank - b.rank)[0];
  const chg = totalPrev ? Math.round((total - totalPrev) / totalPrev * 100) : null;
  const label = state.period === "day" ? "前一日" : "前 7 天";
  const ratio = bull + bear ? Math.round(bull / (bull + bear) * 100) : null;
  $("#tiles").innerHTML = `
    <div class="tile"><div class="k">股票提及次數</div><div class="v num">${fmt(total)}</div>
      <div class="d">${chg === null ? `${label}無資料` : `<span class="chg">${chg >= 0 ? "▲" : "▼"} ${Math.abs(chg)}%</span> vs ${label}`}</div></div>
    <div class="tile"><div class="k">分析的文章／影片</div><div class="v num">${fmt(items)}</div><div class="d">不含推文</div></div>
    <div class="tile"><div class="k">整體看多比例</div><div class="v num">${ratio === null ? "—" : ratio + "%"}</div>
      <div class="d"><span class="up">多 ${fmt(bull)}</span> · <span class="down">空 ${fmt(bear)}</span></div></div>
    <div class="tile"><div class="k">最熱門</div><div class="v">${top ? esc(top.name) : "—"}</div>
      <div class="d">${top ? `${esc(top.code)} · ${fmt(top.m)} 次提及` : "尚無資料"}</div></div>`;
}

function splitBar(o) {
  const neu = Math.max(0, o.m - o.bull - o.bear);
  const seg = (n, c) => n ? `<span style="flex:${n};background:var(${c})"></span>` : "";
  return `<div class="split" role="img" aria-label="看多 ${o.bull}、中立 ${neu}、看空 ${o.bear}">${seg(o.bull, "--bull")}${seg(neu, "--neutral")}${seg(o.bear, "--bear")}</div>
    <div class="split-txt"><span class="up">多 ${o.bull}</span> · <span class="down">空 ${o.bear}</span> · 中立 ${neu}</div>`;
}

function renderRank(rows) {
  const per = state.period === "day" ? "今日" : "本週";
  $("#rankTitle").textContent = `${per}提及排行`;
  const days = periodDays(0);
  $("#rankNote").textContent = days.length ? (days.length === 1 ? md(days[0]) : `${md(days[0])} – ${md(days[days.length - 1])}`) : "";
  if (!rows.length) {
    $("#rank").innerHTML = `<div class="empty">${state.q ? "找不到符合的股票" : "這段期間還沒有資料。<br>第一次使用請到 GitHub 的 Actions 頁面手動執行一次。"}</div>`;
    return;
  }
  const shown = rows.slice(0, 60);
  const max = Math.max(...shown.map(r => r.m));
  $("#rank").innerHTML = `<table>
    <thead><tr><th class="c-rank">#</th><th class="c-stock">股票</th><th class="c-cnt">提及</th><th>多空</th><th class="c-chg">變化</th></tr></thead>
    <tbody>${shown.map(r => {
      const diff = r.m - r.prev;
      const chg = r.prev === 0 ? `<span class="chg">新上榜</span>` :
        diff === 0 ? `<span class="flat">—</span>` :
        `<span class="chg">${diff > 0 ? "▲" : "▼"} ${Math.abs(diff)}</span>`;
      return `<tr data-code="${esc(r.code)}" class="${r.code === state.sel ? "sel" : ""}" title="${esc(Object.entries(r.src).map(([s, n]) => `${SRC_LABEL[s] || s} ${n}`).join("、"))}">
        <td class="c-rank num">${r.rank}</td>
        <td><span class="stock-name">${esc(r.name)}</span><span class="stock-code num">${esc(r.code)}</span>${priceTag((DATA.prices || {})[r.code], false)}</td>
        <td><div class="cnt"><span class="n num">${fmt(r.m)}</span><span class="bar" style="width:${Math.max(3, r.m / max * 100)}%"></span></div></td>
        <td>${splitBar(r)}</td>
        <td class="c-chg num">${chg}</td></tr>`;
    }).join("")}</tbody></table>`;
  $("#rank").querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", () => {
    state.sel = tr.dataset.code; render();
    if (window.innerWidth <= 900) $("#detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

function priceTag(p, big) {
  if (!p) return "";
  const cls = p.chg > 0 ? "up" : p.chg < 0 ? "down" : "flat";
  const arrow = p.chg > 0 ? "▲" : p.chg < 0 ? "▼" : "";
  return big
    ? `<div class="quote"><span class="px num">${p.close.toLocaleString("zh-TW")}</span><span class="${cls} num">${arrow} ${Math.abs(p.chg)}（${Math.abs(p.chg_pct)}%）</span><span class="meta">${md(p.date)} 收盤 · 量 ${fmt(p.volume)}</span></div>`
    : `<span class="stock-px num">${p.close.toLocaleString("zh-TW")} <span class="${cls}">${arrow}${Math.abs(p.chg_pct)}%</span></span>`;
}

function indicatorBlock(p) {
  const v = x => x === null || x === undefined ? "—" : x.toLocaleString("zh-TW");
  const maTrend = p.ma5 && p.ma20 && p.ma60 ? (p.ma5 > p.ma20 && p.ma20 > p.ma60 ? "多頭排列" : p.ma5 < p.ma20 && p.ma20 < p.ma60 ? "空頭排列" : "糾結") : "資料不足";
  const notes = (p.notes || []).map(([t, dir]) =>
    `<span class="sig ${dir > 0 ? "up" : dir < 0 ? "down" : "flat"}">${dir > 0 ? "▲" : dir < 0 ? "▼" : "●"} ${esc(t)}</span>`).join("");
  return `<div class="ind">
      <div class="wide"><span class="k">均線 MA5 / MA20 / MA60</span><span class="v num">${v(p.ma5)} / ${v(p.ma20)} / ${v(p.ma60)}</span><span class="h">${maTrend}</span></div>
      <div><span class="k">RSI(14)</span><span class="v num">${v(p.rsi)}</span><span class="h">${p.rsi >= 70 ? "過熱" : p.rsi <= 30 ? "超賣" : "中性"}</span></div>
      <div><span class="k">K / D</span><span class="v num">${v(p.k)}/${v(p.d)}</span><span class="h">${p.k > p.d ? "K 在 D 上" : "K 在 D 下"}</span></div>

// ======================= K 線圖 =======================
const KCACHE = {};
let KCHARTS = [];
let KTOKEN = 0;
let KRO = null;

function disposeK() { if (KRO) { KRO.disconnect(); KRO = null; } KCHARTS.forEach(c => { try { c.remove(); } catch (e) {} }); KCHARTS = []; }

async function loadK(code) {
  const box = $("#kchart"); if (!box) return;
  const token = ++KTOKEN;
  try {
    if (!KCACHE[code]) {
      const r = await fetch(`k/${encodeURIComponent(code)}.json?v=${encodeURIComponent(DATA.generated_at)}`);
      if (!r.ok) throw new Error(r.status);
      KCACHE[code] = await r.json();
    }
    if (token !== KTOKEN || state.sel !== code) return;
    if (!window.LightweightCharts) throw new Error("圖表元件沒有載入");
    drawK(box, KCACHE[code]);
  } catch (e) {
    box.innerHTML = `<div class="kload">K 線資料還沒準備好（${esc(e.message || e)}）</div>`;
  }
}

// 日 K → 週 K / 月 K
function resample(k, tf) {
  const n = k.d.length, out = { t: [], o: [], h: [], l: [], c: [], v: [], mm: [] };
  const keyOf = d => {
    if (tf === "M") return d.slice(0, 7);
    const dt = new Date(d + "T00:00:00Z"); const wd = (dt.getUTCDay() + 6) % 7;
    return new Date(dt - wd * 864e5).toISOString().slice(0, 10);
  };
  let last = null;
  for (let i = 0; i < n; i++) {
    const key = tf === "D" ? k.d[i] : keyOf(k.d[i]);
    if (key !== last) {
      out.t.push(k.d[i]); out.o.push(k.o[i]); out.h.push(k.h[i]); out.l.push(k.l[i]);
      out.c.push(k.c[i]); out.v.push(k.v[i]); out.mm.push(k.mm[i]); last = key;
    } else {
      const j = out.t.length - 1;
      out.h[j] = Math.max(out.h[j], k.h[i]); out.l[j] = Math.min(out.l[j], k.l[i]);
      out.c[j] = k.c[i]; out.v[j] += k.v[i]; if (k.mm[i] != null) out.mm[j] = k.mm[i];
    }
  }
  return out;
}
const smaArr = (xs, n) => { let s = 0; return xs.map((x, i) => { s += x; if (i >= n) s -= xs[i - n]; return i >= n - 1 ? s / n : null; }); };
const emaArr = (xs, n) => { const k = 2 / (n + 1); let p = null; return xs.map(x => (p = p == null ? x : p + k * (x - p))); };

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawK(box, raw) {
  disposeK();
  const LC = window.LightweightCharts;
  const tf = state.tf || "D";
  const k = resample(raw, tf);
  const n = k.t.length;
  if (n < 2) { box.innerHTML = `<div class="kload">資料不足</div>`; return; }
  const ma5 = smaArr(k.c, 5), ma10 = smaArr(k.c, 10), ma20 = smaArr(k.c, 20);
  const e12 = emaArr(k.c, 12), e26 = emaArr(k.c, 26);
  const dif = e12.map((x, i) => x - e26[i]);
  const sig = emaArr(dif, 9), hist = dif.map((x, i) => x - sig[i]);
  const bias = k.c.map((c, i) => ma10[i] ? (c - ma10[i]) / ma10[i] * 100 : null);
  const hasMM = k.mm.some(x => x != null);

  const C = {
    bg: cssVar("--surface"), text: cssVar("--text-3"), grid: cssVar("--line"), up: cssVar("--bull"), down: cssVar("--bear"),
    ma5: cssVar("--ma5"), ma10: cssVar("--accent"), ma20: cssVar("--ma20"), neutral: cssVar("--text-3"),
  };
  const panes = [
    { id: "main", h: 250, title: "" },
    { id: "macd", h: 100, title: "MACD(12,26,9)" },
    { id: "bias", h: 84, title: "10MA 乖離率" },
  ];
  if (hasMM) panes.push({ id: "mm", h: 90, title: `融資維持率${raw.mm_src === "official" ? "" : "（估算）"}` });
  box.innerHTML = panes.map(p => `<div class="kpane" style="height:${p.h}px"><div class="kleg" id="leg-${p.id}"></div><div class="kc" id="kc-${p.id}" style="height:100%"></div></div>`).join("");

  const base = (last, logo) => ({
    autoSize: true,
    layout: { background: { type: "solid", color: C.bg }, textColor: C.text, fontSize: 11, attributionLogo: logo },
    grid: { vertLines: { color: C.grid }, horzLines: { color: C.grid } },
    rightPriceScale: { borderColor: C.grid, minimumWidth: 64, scaleMargins: { top: 0.18, bottom: 0.08 } },
    timeScale: { borderColor: C.grid, visible: last, rightOffset: 3, tickMarkFormatter: undefined },
    crosshair: { mode: 0 },
    localization: { locale: "zh-TW", dateFormat: "yyyy/MM/dd" },
    handleScale: { axisPressedMouseMove: { time: true, price: false } },
  });
  const line = (chart, color, w = 1) => chart.addLineSeries({ color, lineWidth: w, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  const pts = (arr) => arr.map((v, i) => v == null ? { time: k.t[i] } : { time: k.t[i], value: v });
  const pct = { type: "custom", minMove: 0.01, formatter: v => v.toFixed(1) + "%" };

  const S = {};
  const charts = panes.map((p, idx) => {
    const ch = LC.createChart($(`#kc-${p.id}`), base(idx === panes.length - 1, idx === 0));
    if (p.id === "main") {
      S.candle = ch.addCandlestickSeries({ upColor: C.up, downColor: C.down, borderUpColor: C.up, borderDownColor: C.down, wickUpColor: C.up, wickDownColor: C.down, priceLineVisible: false });
      S.candle.setData(k.t.map((t, i) => ({ time: t, open: k.o[i], high: k.h[i], low: k.l[i], close: k.c[i] })));
      S.vol = ch.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, priceLineVisible: false, lastValueVisible: false });
      ch.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
      S.vol.setData(k.t.map((t, i) => ({ time: t, value: k.v[i], color: (k.c[i] >= k.o[i] ? C.up : C.down) + "66" })));
      S.ma5 = line(ch, C.ma5); S.ma5.setData(pts(ma5));
      S.ma10 = line(ch, C.ma10); S.ma10.setData(pts(ma10));
      S.ma20 = line(ch, C.ma20); S.ma20.setData(pts(ma20));
      S.mainRef = S.candle;
    } else if (p.id === "macd") {
      S.hist = ch.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
      S.hist.setData(k.t.map((t, i) => ({ time: t, value: hist[i], color: hist[i] >= 0 ? C.up : C.down })));
      S.dif = line(ch, C.ma10); S.dif.setData(pts(dif));
      S.sig = line(ch, C.ma5); S.sig.setData(pts(sig));
      S.macdRef = S.dif;
    } else if (p.id === "bias") {
      S.bias = ch.addHistogramSeries({ priceFormat: pct, priceLineVisible: false, lastValueVisible: true });
      S.bias.setData(k.t.map((t, i) => bias[i] == null ? { time: t } : { time: t, value: bias[i], color: bias[i] >= 0 ? C.up : C.down }));
      S.biasRef = S.bias;
    } else if (p.id === "mm") {
      S.mm = ch.addLineSeries({ color: C.ma10, lineWidth: 2, priceFormat: pct, priceLineVisible: false });
      S.mm.setData(pts(k.mm));
      S.mm.createPriceLine({ price: 130, color: C.neutral, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "追繳 130%" });
      S.mmRef = S.mm;
    }
    return ch;
  });
  KCHARTS = charts;

  // 同步縮放／平移
  let syncing = false;
  charts.forEach(ch => ch.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return; syncing = true;
    charts.forEach(o => { if (o !== ch) o.timeScale().setVisibleLogicalRange(r); });
    syncing = false;
  }));
  const show = tf === "D" ? 120 : tf === "W" ? 104 : 60;
  const setRange = () => charts[0].timeScale().setVisibleLogicalRange({ from: Math.max(0, n - show), to: n + 2 });
  setRange(); requestAnimationFrame(setRange);
  // 圖表建立時若還看不到（寬度 0），等它第一次有寬度再設定顯示範圍
  let ranged = box.clientWidth > 0;
  KRO = new ResizeObserver(() => { if (!ranged && box.clientWidth > 0) { ranged = true; setTimeout(setRange, 50); } });
  KRO.observe(box);

  // 圖例（顯示游標所在那根 K 的數值）
  const idxOf = {}; k.t.forEach((t, i) => idxOf[t] = i);
  const f = (x, d = 2) => x == null || isNaN(x) ? "—" : (+x).toLocaleString("zh-TW", { maximumFractionDigits: d });
  const sw = (c, t) => `<i style="color:${c}">${t}</i>`;
  const legend = (i) => {
    const up = k.c[i] >= (i ? k.c[i - 1] : k.o[i]);
    const chg = i ? (k.c[i] - k.c[i - 1]) / k.c[i - 1] * 100 : 0;
    $("#leg-main").innerHTML = `<b>${k.t[i].replaceAll("-", "/")}</b>` +
      `<i>開 ${f(k.o[i])}</i><i>高 ${f(k.h[i])}</i><i>低 ${f(k.l[i])}</i><i style="color:${up ? C.up : C.down}">收 ${f(k.c[i])} (${chg >= 0 ? "+" : ""}${f(chg)}%)</i><i>量 ${f(k.v[i], 0)} 張</i><br>` +
      sw(C.ma5, `MA5 ${f(ma5[i])}`) + sw(C.ma10, `MA10 ${f(ma10[i])}`) + sw(C.ma20, `MA20 ${f(ma20[i])}`);
    $("#leg-macd").innerHTML = `<b>MACD</b>` + sw(C.ma10, `DIF ${f(dif[i])}`) + sw(C.ma5, `訊號 ${f(sig[i])}`) + sw(hist[i] >= 0 ? C.up : C.down, `柱 ${f(hist[i])}`);
    $("#leg-bias").innerHTML = `<b>10MA 乖離率</b>` + sw(bias[i] >= 0 ? C.up : C.down, bias[i] == null ? "—" : `${bias[i] >= 0 ? "+" : ""}${f(bias[i])}%`);
    if (hasMM) $("#leg-mm").innerHTML = `<b>融資維持率${raw.mm_src === "official" ? "" : "（估算）"}</b>` + sw(C.ma10, k.mm[i] == null ? "—" : `${f(k.mm[i], 1)}%`);
  };
  legend(n - 1);
  const refs = [S.mainRef, S.macdRef, S.biasRef, S.mmRef];
  const vals = i => [k.c[i], dif[i], bias[i], k.mm[i]];
  charts.forEach((ch, ci) => ch.subscribeCrosshairMove(p => {
    if (syncing) return;
    const i = p && p.time != null ? idxOf[typeof p.time === "string" ? p.time : `${p.time.year}-${String(p.time.month).padStart(2, "0")}-${String(p.time.day).padStart(2, "0")}`] : undefined;
    syncing = true;
    charts.forEach((o, oi) => {
      if (o === ch || typeof o.setCrosshairPosition !== "function") return;
      if (i == null) o.clearCrosshairPosition();
      else { const v = vals(i)[oi]; if (v != null) o.setCrosshairPosition(v, k.t[i], refs[oi]); }
    });
    syncing = false;
    legend(i == null ? n - 1 : i);
  }));

  // 右上角卡片：融資維持率最新值
  const card = $("#mmCard");
  if (card) {
    const lastMM = [...raw.mm].reverse().find(x => x != null);
    card.querySelector(".v").textContent = lastMM == null ? "—" : lastMM.toFixed(1) + "%";
    card.querySelector(".h").textContent = lastMM == null ? "無融資資料" : (raw.mm_src === "official" ? "官方資料" : "估算值") + (lastMM < 130 ? " · 低於追繳線" : lastMM < 150 ? " · 偏低" : "");
  }
  $("#knote").textContent = hasMM && raw.mm_src !== "official"
    ? "融資維持率為估算值：用每日融資餘額變化推算平均成本，假設融資成數 6 成；只適合看趨勢，與券商實際數字會有落差。" : "";
}

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = []; for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

// 上面是股價、下面是討論熱度：兩個獨立圖面共用同一條日期軸（不使用雙 Y 軸）
function drawChart(box, series, hasPrice) {
  const W = 520, L = 40, R = 6, T = 8, GAP = 30, PH = hasPrice ? 130 : 0, MH = 120, B = 22;
  const H = T + PH + (hasPrice ? GAP : 0) + MH + B;
  const iw = W - L - R, bw = iw / series.length, barW = Math.max(3, bw - 3);
  const cx = i => L + i * bw + bw / 2;
  let svg = "";

  if (hasPrice) {
    const vals = series.flatMap(s => s.p ? [s.p.c, s.p.ma20].filter(x => x != null) : []);
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 3);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const y = v => T + PH - (v - lo) / (hi - lo || 1) * PH;
    ticks.forEach(t => svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis num" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t.toLocaleString("zh-TW")}</text>`);
    const path = key => { let d = "", pen = false;
      series.forEach((s, i) => { const v = s.p ? s.p[key] : null; if (v == null) return; d += `${pen ? "L" : "M"}${cx(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      return d; };
    svg += `<path d="${path("ma20")}" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    svg += `<path d="${path("c")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lastI = series.map(s => !!s.p).lastIndexOf(true);
    if (lastI >= 0) svg += `<circle cx="${cx(lastI)}" cy="${y(series[lastI].p.c)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  }

  const top = T + PH + (hasPrice ? GAP : 0);
  const step = Math.ceil(Math.max(4, ...series.map(s => s.m)) / 4), yMax = step * 4;
  const y2 = v => top + MH - v / yMax * MH;
  for (let i = 0; i <= 4; i += 2) svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y2(step * i)}" y2="${y2(step * i)}"/><text class="axis num" x="${L - 6}" y="${y2(step * i) + 4}" text-anchor="end">${step * i}</text>`;
  series.forEach((s, i) => {
    const x = L + i * bw + (bw - barW) / 2;
    let base = top + MH;
    const parts = [["bull", "--bull"], ["neu", "--neutral"], ["bear", "--bear"]].filter(([k]) => s[k] > 0);
    parts.forEach(([k, c], j) => {
      const h = s[k] / yMax * MH, hh = Math.max(0, h - (j > 0 ? 2 : 0));
      const r = j === parts.length - 1 ? Math.min(3, barW / 2, hh) : 0;
      svg += r > 0
        ? `<path d="M${x},${base} v${-(hh - r)} q0,${-r} ${r},${-r} h${barW - 2 * r} q${r},0 ${r},${r} v${hh - r} z" fill="var(${c})"/>`
        : `<rect x="${x}" y="${base - hh}" width="${barW}" height="${hh}" fill="var(${c})"/>`;
      base -= h;
    });
    if ((series.length - 1 - i) % 7 === 0) svg += `<text class="axis" x="${cx(i)}" y="${H - 6}" text-anchor="middle">${md(s.d)}</text>`;
  });
  svg += `<line x1="${L}" x2="${W - R}" y1="${top + MH}" y2="${top + MH}" stroke="var(--text-3)" stroke-width="1"/>`;
  if (hasPrice) svg += `<text class="axis" x="${L}" y="${top - 8}">討論次數</text>`;
  svg += `<line id="guide" x1="0" x2="0" y1="${T}" y2="${top + MH}" stroke="var(--text-3)" stroke-width="1" opacity="0"/>`;
  svg += series.map((s, i) => `<rect data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${top + MH - T}" fill="transparent"/>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 30 天${hasPrice ? "收盤價與" : ""}每日提及次數">${svg}</svg>`;

  const tip = $("#tip"), guide = box.querySelector("#guide");
  box.querySelectorAll("rect[data-i]").forEach(r => {
    r.addEventListener("mousemove", e => {
      const i = +r.dataset.i, s = series[i];
      const px = s.p ? `<div>收盤 <b style="display:inline">${s.p.c.toLocaleString("zh-TW")}</b>${s.p.ma20 != null ? `　月線 ${s.p.ma20.toLocaleString("zh-TW")}` : ""}</div>` : (hasPrice ? `<div class="meta">休市</div>` : "");
      tip.innerHTML = `<b>${md(s.d)}</b>${px}<div>${s.m} 次提及：<span class="up">多 ${s.bull}</span>　中立 ${s.neu}　<span class="down">空 ${s.bear}</span></div>`;
      tip.style.opacity = 1;
      guide.setAttribute("x1", cx(i)); guide.setAttribute("x2", cx(i)); guide.setAttribute("opacity", ".5");
      const tw = tip.offsetWidth;
      let x = e.pageX + 12; if (x + tw > window.scrollX + document.documentElement.clientWidth - 8) x = e.pageX - tw - 12;
      tip.style.left = x + "px"; tip.style.top = (e.pageY - 60) + "px";
    });
    r.addEventListener("mouseleave", () => { tip.style.opacity = 0; guide.setAttribute("opacity", "0"); });
  });
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.period === state.period));
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", state.sources.has(c.dataset.src)));
  const { rows, cur, prev } = ranked();
  if (!state.sel || !DATA.names[state.sel]) state.sel = rows[0]?.code || null;
  renderTiles(rows, cur, prev);
  renderRank(rows);
  renderDetail(rows);
}

function init() {
  load();
  $("#chips").innerHTML = SOURCES.map(s => `<button class="chip" data-src="${s.key}">${s.label}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    const k = c.dataset.src;
    if (state.sources.has(k)) { if (state.sources.size > 1) state.sources.delete(k); } else state.sources.add(k);
    save(); render();
  }));
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.period = b.dataset.period; save(); render(); }));
  $("#search").addEventListener("input", e => { state.q = e.target.value; render(); });

  fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    DATA = d;
    const t = new Date(d.generated_at);
    $("#sub").textContent = `資料日期 ${d.latest_date} · 更新於 ${t.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })}`;
    render();
  }).catch(() => {
    $("#sub").textContent = "還沒有資料";
    $("#rank").innerHTML = `<div class="empty">找不到 data.json。<br>請到 GitHub 的 Actions 頁面手動執行一次爬蟲。</div>`;
    $("#detail").innerHTML = "";
  });
}
init();
</script>
</body>
</html>
